<text x="36" y="456" fill="#5E6A75" font-size="13">Cada coluna é o estado depois da subida do clk. IF é a instrução que a memória apresenta no meio do ciclo, depois da descida.</text>
<text x="36" y="478" fill="#5E6A75" font-size="13">Ciclo em que EX contém lw x8 e ID contém add: stall de load-use. No ciclo seguinte o controle de EX é zerado (bolha) e o add permanece em ID.</text>
<text x="36" y="500" fill="#5E6A75" font-size="13">Quando add está em EX, B vem do write-back (o lw de x8). A ALU já mostra 3. No WB seguinte, x2 é escrito com 3.</text>
<text x="36" y="522" fill="#5E6A75" font-size="13">x7 ← 1 em 45 ns, x8 ← 2 em 55 ns, x2 ← 3 em 75 ns — os mesmos horários do transcript ModelSim de 10/08/2023.</text>
